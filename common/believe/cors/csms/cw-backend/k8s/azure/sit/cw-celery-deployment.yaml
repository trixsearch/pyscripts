apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cw-celery
  name: cw-celery
  namespace: cw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cw-celery
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cw-celery
    spec:
      imagePullSecrets:
        - name: cwms-jfrog 
      containers:
        - command: ["celery"]
          args: ["-A", "ezedox", "worker", "--concurrency", "8", "--loglevel=info"]
          image: devopsartifact.jio.com/jpf-cwms__sit__dcr/cw-backend:#{Build.BuildId}#
          imagePullPolicy: Always          
          name: cw-backend-celery-dev
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cw-sit-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: POSTGRES_USER
            - name: FLOWABLE_POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: POSTGRES_HOST
            - name: FLOWABLE_POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: POSTGRES_PORT
            - name: FLOWABLE_POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: FLOWABLE_POSTGRES_DB
            - name: FLOWABLE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cw-sit-secret
                  key: POSTGRES_PASSWORD
            - name: FLOWABLE_POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: POSTGRES_USER
            - name: FILE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: FILE_BUCKET
            - name: AZURE_ACCOUNT_NAME
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: AZURE_ACCOUNT_NAME
            - name: AZURE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: cw-sit-secret
                  key: AZURE_ACCOUNT_KEY
            - name: AZURE_CONTAINER
              valueFrom:
                configMapKeyRef:
