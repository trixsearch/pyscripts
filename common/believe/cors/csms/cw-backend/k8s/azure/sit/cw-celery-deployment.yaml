                  name: cw-sit-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 1000m
              memory: "1Gi"
            limits:
              cpu: 2000m
              memory: "2Gi"
      volumes:
        - name: tmp-files
          emptyDir: {}
      restartPolicy: Always