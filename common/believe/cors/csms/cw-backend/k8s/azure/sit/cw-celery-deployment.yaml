            - name: DEFAULT_SCHEME
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: DEFAULT_SCHEME
            - name: ALLOWED_HOST_FOR_CW_HEADERS
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: ALLOWED_HOST_FOR_CW_HEADERS
            - name: KALEYRA_OTP_TEMPLATE_ID
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: KALEYRA_OTP_TEMPLATE_ID
            - name: SSL_VERIFICATION
              valueFrom:
                configMapKeyRef:
                  name: cw-sit-config
                  key: SSL_VERIFICATION
            - name: LOG_LEVEL
              valueFrom:
