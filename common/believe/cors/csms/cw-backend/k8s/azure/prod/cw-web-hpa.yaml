  apiVersion: autoscaling/v2beta2 
  kind: HorizontalPodAutoscaler
  metadata:
    name: cw-web
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: cw-web
    minReplicas: 6
    maxReplicas: 10
    metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization 
          averageUtilization: 75